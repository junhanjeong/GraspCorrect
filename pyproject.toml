[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graspcorrect"
version = "0.1.0"
description = "Reproduction-oriented implementation of GraspCorrect for RLBench and CALVIN."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GraspCorrect reproduction"}]
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.5",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.1",
    "torchvision>=0.16",
]
vlm = [
    "openai>=1.0",
]
vision = [
    "opencv-python>=4.8",
]
dev = [
    "pytest>=7.4",
]
all = [
    "graspcorrect[train,vlm,vision,dev]",
]

[tool.setuptools.packages.find]
include = ["graspcorrect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
