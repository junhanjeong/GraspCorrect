[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graspcorrect"
version = "0.1.0"
description = "RLBench-focused reproduction implementation of GraspCorrect."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "GraspCorrect reproduction"}]
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=1.13",
    "torchvision>=0.14",
]
vlm = [
    "openai>=1.0",
]
vision = [
    "opencv-python>=4.8",
]
rlbench = [
    "typed-argument-parser",
    "einops",
    "open3d",
]
dev = [
    "pytest>=7.4",
]
all = [
    "graspcorrect[train,vlm,vision,rlbench,dev]",
]

[tool.setuptools.packages.find]
include = ["graspcorrect*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
